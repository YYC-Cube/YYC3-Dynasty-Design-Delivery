name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # Weekly security sweep: push/PR runs cannot detect advisories published
  # *after* a dependency was locked, so re-audit the existing tree every Monday.
  schedule:
    - cron: '0 2 * * 1'
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

# Cancel any superseded run on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: typecheck · lint · audit · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # No `version` input: pnpm/action-setup reads package.json#packageManager,
      # so CI runs the exact pnpm that produced pnpm-lock.yaml.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # The repo's supportedArchitectures pins linux/{x64,arm64}/glibc, which is
      # exactly what ubuntu-latest provides — no extra config needed here.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (app)
        run: pnpm typecheck

      # vite.config.ts belongs to its own project (tsconfig.node.json) and is
      # NOT covered by `tsc -p tsconfig.json`. Without this step a missing
      # @types/node or a broken config import would only surface during build.
      - name: Typecheck (node config)
        run: pnpm typecheck:node

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Circular dependency scan
        run: pnpm madge

      # Fails on high/critical advisories in the *locked* tree. Complements
      # Dependabot: this also runs on the weekly schedule.
      - name: Security audit
        run: pnpm security:audit

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      # Optional: keep the build artifact for download / deploy debugging.
      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 7

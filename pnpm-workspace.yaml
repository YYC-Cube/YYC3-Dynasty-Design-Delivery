packages:
  - '.'
supportedArchitectures:
  os:
    - linux
  cpu:
    - x64
    - arm64
  libc:
    - glibc
# Refuse packages published < 7 days ago, matching the root pnpm-workspace.yaml.
minimumReleaseAge: 10080
# Narrow, documented exemption: every postcss release that fixes
# GHSA-6g55-p6wh-862q (path traversal in source-map auto-loading) and the
# follow-up advisory is still inside the 7-day cooling window. Shipping a known
# vulnerable build for a week is the worse trade-off, so postcss alone skips
# the gate. Remove this entry once 8.5.23+ has matured.
minimumReleaseAgeExclude:
  - postcss
allowBuilds:
  '@tailwindcss/oxide': false
  esbuild: false
# Pin React types to v18 across the whole tree. Without this, transitive
# consumers (lucide-react, react-router, etc.) pull @types/react@19 and
# produce TS2786 "cannot be used as a JSX component" errors at every icon/link.
overrides:
  '@types/react': 18.3.1
  '@types/react-dom': 18.3.1

  # ── Security overrides (transitive dev tooling only) ──────────────────────
  # Pinned to the first patched release within each existing major line, so no
  # consumer receives a breaking major bump. Verified clean via `pnpm audit`.
  # brace-expansion has two live lines in the tree; both need patching.
  'brace-expansion@<2': 1.1.21
  'brace-expansion@>=4': 5.0.12
  postcss: 8.5.30
  'js-yaml@<5': 4.3.2
  'nanoid@<4': 3.3.20
  'tar@<8': 7.5.22
  browserslist: 4.29.3
  # 2.11.29 is <7 days old; 2.11.28 is the newest release past the
  # minimumReleaseAge gate and already outside the vulnerable range.
  baseline-browser-mapping: 2.11.28
  source-map-js: 1.2.2
